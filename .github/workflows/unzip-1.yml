name: Unzip project
on:
  push:
    paths:
      - "mahboobahstitches.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repository root
        if: hashFiles('mahboobahstitches.zip') != ''
        run: |
          unzip -o mahboobahstitches.zip
          rm mahboobahstitches.zip
      - name: Commit extracted files
        if: hashFiles('mahboobahstitches.zip') != ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Phase 1 storefront" || echo "nothing to commit"
          git push
