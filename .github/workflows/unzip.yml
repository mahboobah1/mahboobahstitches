name: Unzip project
on:
  push:
    paths:
      - "mahboobahstitches.zip"
      - "product-images.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract any uploaded zip into the repository root
        run: |
          found=0
          for z in mahboobahstitches.zip product-images.zip; do
            if [ -f "$z" ]; then unzip -o "$z"; rm "$z"; found=1; fi
          done
          echo "found=$found" >> "$GITHUB_ENV"
      - name: Remove old leftover files from earlier versions
        if: env.found == '1'
        run: |
          # These were replaced in later versions and are no longer used by the website.
          rm -rf functions App.tsx main.tsx vite-env.d.ts src/data/collections.ts src/data/demo-products.ts docs/DEPLOY.md migrations/README.md
      - name: Commit extracted files
        if: env.found == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add uploaded files" || echo "nothing to commit"
          git push
