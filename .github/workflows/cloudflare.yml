name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Unzip project"]
    types: [completed]
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that all four secrets are set
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID SETUP_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret: $v (see docs/SETUP-CLOUDFLARE.md)"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Insert the D1 database id
        run: sed -i "s/REPLACE_WITH_DATABASE_ID/${D1_DATABASE_ID}/" wrangler.toml
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply mahboobah-db --remote
      - name: Deploy website and API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SETUP_TOKEN
